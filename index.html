<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WA Replay Viewer</title>
<style>
  :root {
    --bg: #0b0c0f; --panel: rgba(16,18,22,.86); --line: #252a31; --text: #d7dbe1; --dim: #7a828e;
    --land: #3b5a3c; --water: #1b3a57; --shot: #ffb347; --chute: #6fe3ff; --accent: #4fc3ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font: 13px/1.4 ui-monospace, Consolas, monospace; }
  canvas#cv { position: absolute; left: 50%; top: calc(50% - 26px); transform: translate(-50%, -50%); display: block; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; height: 52px; display: flex; align-items: center; gap: 10px;
    padding: 0 14px; background: var(--panel); border-top: 1px solid var(--line); }
  #bar[hidden] { display: none; }
  button, select { background: #15181d; color: var(--text); border: 1px solid var(--line); border-radius: 5px;
    font: inherit; padding: 4px 9px; cursor: pointer; }
  button:hover, select:hover { border-color: var(--dim); }
  #play { width: 42px; font-size: 15px; }
  #track { position: relative; flex: 1; height: 26px; display: flex; align-items: center; }
  #seek { width: 100%; margin: 0; accent-color: var(--accent); position: relative; z-index: 1; background: transparent; }
  #ticks { position: absolute; inset: 4px 0; pointer-events: none; }
  #ticks i { position: absolute; top: 0; bottom: 0; width: 1px; background: #3a414b; }
  #time { color: var(--dim); min-width: 120px; text-align: right; }
  #drop { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; color: var(--dim); text-align: center; padding: 16px; }
  #drop b { color: var(--text); font-size: 20px; letter-spacing: .04em; }
  #drop.over { background: rgba(79,195,255,.06); outline: 2px dashed var(--accent); outline-offset: -14px; }
  #drop .open { font-size: 14px; padding: 8px 18px; color: var(--text); }
  #drop small { max-width: 520px; }
  #msg { color: #ff8a80; min-height: 1em; }
  #file { display: none; }
</style>
</head>
<body>
<canvas id="cv" width="1920" height="696"></canvas>
<div id="drop">
  <b>WA REPLAY VIEWER</b>
  <button class="open" id="openBig">Open a .watrace</button>
  <small>or drop it here · .WAgame replays can't be opened directly yet: convert them to .watrace first (wa-trace.bat)</small>
  <div id="msg"></div>
</div>
<div id="bar" hidden>
  <button id="open" title="open another replay">Open</button>
  <button id="prev" title="previous turn (Shift+←)">⏮</button>
  <button id="play" title="play / pause (Space)">▶</button>
  <button id="next" title="next turn (Shift+→)">⏭</button>
  <select id="speed" title="speed">
    <option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option>
    <option value="4">4×</option><option value="8">8×</option><option value="16">16×</option>
  </select>
  <div id="track"><div id="ticks"></div><input id="seek" type="range" min="0" max="0" value="0" step="1"></div>
  <span id="time">0:00</span>
</div>
<input id="file" type="file" accept=".watrace,.gz,.jsonl">
<script>
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const C = { land: css('--land'), water: css('--water'), shot: css('--shot'), chute: css('--chute') };
const TEAMS = ['#ff5d5d', '#4fc3ff', '#57d18c', '#f7d154', '#c78bff', '#ff9f43'];
const teamColor = t => TEAMS[t % TEAMS.length];
const FONT = 'ui-monospace, Consolas, monospace';
const FRAME_MS = 20;   // WA: 50 frames a second

// the replay: meta, the entity frames (every 2nd game frame), terrain changes, turns
let R = null;
let pos = 0, playing = false, last = 0, U = 1;

// ---------------------------------------------------------------- loading
async function load(file) {
  if (/\.wagame$/i.test(file.name)) {
    $('msg').textContent = 'that is a .WAgame replay: convert it to a .watrace first (drop it on wa-trace.bat), then open the .watrace here';
    $('drop').style.display = 'flex';
    return;
  }
  $('msg').textContent = 'reading…';
  try {
    const head = new Uint8Array(await file.slice(0, 2).arrayBuffer());
    let stream = file.stream();
    if (head[0] === 0x1f && head[1] === 0x8b) stream = stream.pipeThrough(new DecompressionStream('gzip'));
    const reader = stream.pipeThrough(new TextDecoderStream()).getReader();
    const r = { meta: {}, frames: [], maps: [], turns: [], preds: [], fchecks: new Map(), shots: [], hits: [], balls: new Map(), acount: new Map(), abad: new Map(), gas: new Map(), pcount: new Map(), mcount: new Map(), xbad: new Map(), ahits: [], acheck: new Map(), wchecks: [] };
    let rest = '';
    const line = l => {
      if (!l) return;
      let m; try { m = JSON.parse(l); } catch (_) { return; }
      if (m.type === 'ents') r.frames.push(m);
      else if (m.type === 'map') r.maps.push(m);
      else if (m.type === 'meta') r.meta = m;
      else if (m.type === 'pred') r.preds.push(m);
      else if (m.type === 'fcheck') r.fchecks.set(m.t, m);
      else if (m.type === 'shot') r.shots.push(m);
      else if (m.type === 'hit') r.hits.push(m);
      else if (m.type === 'ball') r.balls.set(m.id + ':' + m.t, m);
      else if (m.type === 'acount') r.acount.set(m.t, m);
      else if (m.type === 'acheck' && !m.ok) (r.abad.get(m.t) || r.abad.set(m.t, []).get(m.t)).push(m);
      else if (m.type === 'gcount') r.gas.set(m.t, m);
      else if (m.type === 'pcount') r.pcount.set(m.t, m);
      else if (m.type === 'ahit') r.ahits.push(m);
      else if (m.type === 'gcheckshot' || m.type === 'mcheckhit') r.wchecks.push(m);
      else if (m.type === 'archeck') { (r.acheck.get(m.t) || r.acheck.set(m.t, []).get(m.t)).push(m); if (!m.ok) (r.xbad.get(m.t) || r.xbad.set(m.t, []).get(m.t)).push(m); }
      else if (m.type === 'mcount') r.mcount.set(m.t, m);
      else if ((m.type === 'pcheck' || m.type === 'dcheck' || (m.type === 'mcheck' && m.x != null)) && !m.ok) (r.xbad.get(m.t) || r.xbad.set(m.t, []).get(m.t)).push(m);
    };
    try {
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        const parts = (rest + value).split('\n'); rest = parts.pop();
        for (const p of parts) line(p);
      }
    } catch (_) { /* a trace cut short: keep what was read */ }
    line(rest);
    if (!r.frames.length || !r.maps.length) throw new Error('no frames in this file');
    // turns: the turn worm changes
    let prev = null;
    r.frames.forEach((f, i) => {
      const w = f.worms.find(w => w[5]);
      if (w && w[0] !== prev) { r.turns.push(i); prev = w[0]; }
    });
    if (!r.turns.length || r.turns[0] !== 0) r.turns.unshift(0);
    // the model layer: where each predicted path first leaves the real one
    const byT = new Map(r.frames.map((f, k) => [f.t, k]));
    for (const pr of r.preds) {
      pr.end = pr.t + pr.pts.length - 1; pr.diverge = null;
      // a path into the water: compared up to the frame before (WA slows it on entry)
      for (let k = 0; k < pr.pts.length - (pr.water ? 1 : 0); k++) {
        if (pr.ball) {   // logged every frame; it ends early on a worm (the path is terrain only)
          const b = r.balls.get(pr.id + ':' + (pr.t + k)); if (!b) break;
          if (b.x !== pr.pts[k][0] || b.y !== pr.pts[k][1]) { pr.diverge = { k, wa: [b.x, b.y], model: pr.pts[k] }; break; }
          continue;
        }
        const fi = byT.get(pr.t + k); if (fi == null) continue;
        const a = r.frames[fi].proj.find(q => q[0] === pr.id); if (!a) break;
        if (a[1] !== pr.pts[k][0] || a[2] !== pr.pts[k][1]) { pr.diverge = { k, wa: [a[1], a[2]], model: pr.pts[k] }; break; }
      }
    }
    R = r; pos = 0; playing = true; caches.clear();
    $('drop').style.display = 'none'; $('bar').hidden = false;
    $('seek').max = r.frames.length - 1;
    $('ticks').innerHTML = r.turns.slice(1).map(i => `<i style="left:${(i / (r.frames.length - 1)) * 100}%"></i>`).join('');
    document.title = (r.meta.name || file.name) + ' · WA Replay Viewer';
    $('msg').textContent = '';
  } catch (e) {
    $('msg').textContent = 'could not read it: ' + e.message;
    $('drop').style.display = 'flex';
  }
}

// terrain canvases, built when first shown
const caches = new Map();
function terrainAt(t) {
  let lo = 0, hi = R.maps.length - 1, k = 0;
  while (lo <= hi) { const m = (lo + hi) >> 1; if (R.maps[m].t <= t) { k = m; lo = m + 1; } else hi = m - 1; }
  if (!caches.has(k)) caches.set(k, terrain(R.maps[k]));
  return R.maps[k];
}
function terrain(m) {
  const c = document.createElement('canvas'); c.width = m.w; c.height = m.h;
  const g = c.getContext('2d'), img = g.createImageData(m.cw, m.ch), raw = atob(m.map);
  const [r, gr, b] = [1, 3, 5].map(i => parseInt(C.land.slice(i, i + 2), 16));
  for (let i = 0; i < m.cw * m.ch; i++) {
    if (raw.charCodeAt(i >> 3) >> (i & 7) & 1) { const o = i * 4; img.data[o] = r; img.data[o+1] = gr; img.data[o+2] = b; img.data[o+3] = 255; }
  }
  const t = document.createElement('canvas'); t.width = m.cw; t.height = m.ch; t.getContext('2d').putImageData(img, 0, 0);
  g.imageSmoothingEnabled = false; g.drawImage(t, 0, 0, m.w, m.h);
  return c;
}

// ---------------------------------------------------------------- drawing
function fit(w, h) {
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  const k = Math.min(innerWidth / w, (innerHeight - 52) / h);
  cv.style.width = Math.floor(w * k) + 'px'; cv.style.height = Math.floor(h * k) + 'px';
  U = Math.max(1, 1 / k);
}
const S = () => Math.max(1, U * 0.7);
function dot(x, y, r, c, ring) {
  ctx.beginPath(); ctx.arc(x, y, r * S(), 0, 7);
  if (ring) { ctx.strokeStyle = c; ctx.lineWidth = 2 * S(); ctx.stroke(); } else { ctx.fillStyle = c; ctx.fill(); }
}
function turnOf(i) { let k = 0; for (let j = 0; j < R.turns.length && R.turns[j] <= i; j++) k = j; return k; }

function draw() {
  const i = Math.min(R.frames.length - 1, Math.floor(pos)), f = R.frames[i];
  const m = terrainAt(f.t);
  fit(m.w, m.h);
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = C.water; ctx.fillRect(0, m.water, m.w, m.h - m.water);
  ctx.drawImage(caches.get(R.maps.indexOf(m)), 0, 0);
  const s = S();
  for (const [x, y] of f.mines) dot(x, y, 5, '#d33', true);
  for (const [x, y] of f.drums) { ctx.fillStyle = '#c97a2b'; ctx.fillRect(x - 8 * s, y - 12 * s, 16 * s, 22 * s); }
  for (const [x, y] of f.crates) { ctx.strokeStyle = '#e6c84f'; ctx.lineWidth = 2 * s; ctx.strokeRect(x - 10 * s, y - 18 * s, 20 * s, 24 * s); }
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  // the turn worm's path this turn
  const me = f.worms.find(w => w[5]);
  const t0 = R.turns[turnOf(i)];
  if (me) {
    ctx.strokeStyle = '#ffffff55'; ctx.lineWidth = 3 * s; ctx.beginPath();
    let started = false;
    for (let j = t0; j <= i; j++) {
      const w = R.frames[j].worms.find(w => w[0] === me[0]); if (!w) continue;
      if (!started) { ctx.moveTo(w[1], w[2]); started = true; } else ctx.lineTo(w[1], w[2]);
    }
    ctx.stroke();
  }
  // projectiles: a short trail behind each
  ctx.setLineDash([2 * s, 5 * s]);
  for (const p of f.proj) {
    ctx.strokeStyle = C.shot + 'aa'; ctx.lineWidth = 2 * s; ctx.beginPath(); ctx.moveTo(p[1], p[2]);
    for (let j = i - 1; j >= Math.max(0, i - 75); j--) {
      const q = R.frames[j].proj.find(q => q[0] === p[0]); if (!q) break; ctx.lineTo(q[1], q[2]);
    }
    ctx.stroke();
  }
  ctx.setLineDash([]);
  if (f.rope.length > 1) {
    ctx.strokeStyle = '#e8d9a8'; ctx.lineWidth = 2 * s; ctx.beginPath(); ctx.moveTo(f.rope[0][0], f.rope[0][1]);
    for (const p of f.rope) ctx.lineTo(p[0], p[1]); ctx.stroke();
    dot(f.rope[0][0], f.rope[0][1], 4, '#e8d9a8');
  }
  ctx.font = `bold ${11 * s}px ${FONT}`; ctx.textAlign = 'center';
  for (const [, x, y, team, st, on, hp] of f.worms) {
    if (st === 0x7D) canopy(x, y);
    dot(x, y, on ? 11 : 9, teamColor(team));
    if (on) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5 * s; ctx.beginPath(); ctx.arc(x, y, 16 * s, 0, 7); ctx.stroke(); }
    if (hp != null) {
      const h = hp > 100000 ? hp >> 16 : hp;
      ctx.fillStyle = teamColor(team); ctx.fillText(h, x, y - (on ? 22 : 15) * s);
    }
  }
  // Longbow arrows (other entities, vtable 0x664198): a shaft along the motion
  for (const o of (f.others || [])) {
    if (o[3] !== 0x664198) continue;
    const prev = i > 0 && (R.frames[i - 1].others || []).find(q => q[0] === o[0]);
    let dx = 1, dy = 0;
    if (prev && (prev[1] !== o[1] || prev[2] !== o[2])) { dx = o[1] - prev[1]; dy = o[2] - prev[2]; }
    const k = Math.hypot(dx, dy) || 1, L = 9 * S();
    ctx.strokeStyle = '#e8d9a8'; ctx.lineWidth = 2 * S();
    ctx.beginPath(); ctx.moveTo(o[1] - dx / k * L, o[2] - dy / k * L); ctx.lineTo(o[1], o[2]); ctx.stroke();
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(o[1], o[2], 1.8 * S(), 0, 7); ctx.fill();
  }
  // arrow hits: a flash, the push it gave (velocity / 4), what it hit
  for (const h of R.ahits) {
    if (h.t > f.t || f.t - h.t > 25) continue;
    const a = 1 - (f.t - h.t) / 25, x = h.x / 65536, y = h.y / 65536;
    ctx.strokeStyle = `rgba(255,220,140,${a})`; ctx.lineWidth = 2 * S();
    ctx.beginPath(); ctx.arc(x, y, 6 * S(), 0, 7); ctx.stroke();
    if (h.partner !== 'terrain') { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + h.push[0] / 65536 * 6, y + h.push[1] / 65536 * 6); ctx.stroke(); }
  }
  // fires: size and glow by strength; drum fire amber, petrol red
  for (const [, x, y, st, petrol] of (f.fires || [])) {
    const k = st / 65535, flick = 0.85 + 0.15 * Math.sin(performance.now() / 70 + x * 1.7);
    ctx.fillStyle = (petrol ? '#ff4a1c' : '#ffa22e') + hx(90 + 140 * k);
    ctx.beginPath(); ctx.arc(x, y, (2 + 4 * k) * flick * s, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffe9a8' + hx(120 + 120 * k);
    ctx.beginPath(); ctx.arc(x, y, (1 + 1.5 * k) * s, 0, 7); ctx.fill();
  }
  // skunk gas (logged every frame; the ents every 2nd): a cloud per entity, sized by its age
  const gas = R.gas.get(f.t) || R.gas.get(f.t - 1);
  if (gas && gas.c.length) {
    for (const [x, y, reach] of gas.c) {
      const r = (4 + reach * 0.35) * S();
      ctx.fillStyle = 'rgba(150,220,90,0.16)'; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    }
  }
  // projectiles by kind (the rendered sprite: cluster pieces differ from their shell)
  const seen = new Set();
  for (const q of f.proj) {
    const [, x, y] = q, kind = KINDS[q[4]] || KINDS[q[3]] || ['projectile', C.shot, 'dot', 6];
    seen.add(kind[0]);
    shape(x, y, kind, q, i);
  }
  if (f.fires && f.fires.length) seen.add(`fire ×${f.fires.length}`);
  if (gas && gas.c.length) seen.add(`skunk gas ×${gas.c.length}`);
  for (const n of strikes(f)) seen.add(n);
  if ((f.others || []).some(o => o[3] === 0x664198)) seen.add('arrow');
  for (const h of R.ahits) if (h.t <= f.t && f.t - h.t <= 25) seen.add(`arrow hit (${h.partner})`);
  // Dragon Ball fireballs (logged every frame; the ents every 2nd)
  for (const t of [f.t, f.t + 1]) for (const pr of R.preds) {
    if (!pr.ball) continue;
    const b = R.balls.get(pr.id + ':' + t); if (!b) continue;
    const s = S(), g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, 9 * s);
    g.addColorStop(0, '#fff6c8'); g.addColorStop(0.4, '#ffb02e'); g.addColorStop(1, 'rgba(255,90,20,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, b.y, 9 * s, 0, 7); ctx.fill();
    seen.add('dragon ball'); break;
  }
  legend([...seen]);
  if (showModel) model(f, i);
  hud(f, i);
  // the bar
  $('seek').value = i;
  $('time').textContent = `${clock(f.t)} / ${clock(R.frames[R.frames.length - 1].t)}`;
  $('play').textContent = playing ? '⏸' : '▶';
}
// guns and melee (no game objects): each shot as a tracer from the muzzle to where it struck
// (the hit in the same frame) or on to the map edge; each hit box as a flash, with the push
const WEAPONS = { 11: 'shotgun', 12: 'handgun', 13: 'uzi', 14: 'minigun', 16: 'fire punch', 17: 'dragon ball', 35: 'baseball bat',
  9: 'battle axe', 20: 'prod', 32: 'blowtorch', 33: 'drill', 18: 'kamikaze', 19: 'suicide bomber' };
const FX = 65536;
function strikes(f) {
  const s = S(), names = new Set(), age = t => (f.t - t) / 30;
  for (const sh of R.shots) {
    if (sh.t > f.t || f.t - sh.t > 30) continue;
    const a = 1 - age(sh.t), x0 = sh.x / FX, y0 = sh.y / FX;
    const hit = R.hits.find(h => h.t === sh.t && h.by === sh.worm && h.kind === 3);
    let x1, y1;
    if (hit) { x1 = hit.x / FX; y1 = hit.y / FX; }
    else {   // to the map edge along the aim
      const dx = sh.dx / FX, dy = sh.dy / FX, W = cv.width, H = cv.height;
      let k = 4000;
      if (dx) k = Math.min(k, dx > 0 ? (W - x0) / dx : -x0 / dx);
      if (dy) k = Math.min(k, dy > 0 ? (H - y0) / dy : -y0 / dy);
      x1 = x0 + dx * k; y1 = y0 + dy * k;
    }
    ctx.strokeStyle = `rgba(255,236,150,${0.9 * a})`; ctx.lineWidth = 2 * s;
    ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    ctx.fillStyle = `rgba(255,255,220,${a})`; ctx.beginPath(); ctx.arc(x0, y0, 4 * s * a, 0, 7); ctx.fill();
    names.add(`${WEAPONS[sh.weapon] || 'gun'} shot`);
  }
  for (const h of R.hits) {
    if (h.t > f.t || f.t - h.t > 20) continue;
    const a = 1 - (f.t - h.t) / 20, x = h.x / FX, y = h.y / FX, w = h.w / FX, hh = h.h / FX;
    const tool = h.weapon === 32 || h.weapon === 33;
    ctx.strokeStyle = h.hit ? `rgba(255,90,90,${a})` : `rgba(255,200,120,${(tool ? 0.25 : 0.6) * a})`;
    ctx.lineWidth = (h.hit ? 2.5 : 1.5) * s;
    ctx.strokeRect(x - w, y - hh, w * 2, hh * 2);
    if (h.hit) {   // the push
      const px = h.px / FX * 6, py = h.py / FX * 6;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + px, y + py); ctx.stroke();
    }
    names.add(`${WEAPONS[h.weapon] || 'impact'}${h.hit ? ' hit' : ''}`);
  }
  return names;
}

// the model layer (M): predicted projectile paths (dashed) with the first frame they leave
// WA's (red cross), and the fires our fire model got wrong this frame (red rings)
let showModel = true;
function model(f, i) {
  const s = S();
  ctx.lineWidth = 1.5 * s; ctx.setLineDash([4 * s, 4 * s]);
  for (const pr of R.preds) {
    if (pr.t > f.t || f.t > pr.end + 100) continue;
    const ok = !pr.diverge;
    ctx.strokeStyle = ok ? 'rgba(111,227,255,0.55)' : 'rgba(255,120,120,0.6)';
    ctx.beginPath(); ctx.moveTo(pr.pts[0][0], pr.pts[0][1]);
    for (const p of pr.pts) ctx.lineTo(p[0], p[1]);
    ctx.stroke();
    if (pr.target) {   // the homing target the worm picked
      const [x, y] = pr.target, r = 9 * s;
      ctx.setLineDash([]); ctx.strokeStyle = '#ff6b6b'; ctx.lineWidth = 2 * s;
      ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.moveTo(x - r * 1.6, y); ctx.lineTo(x + r * 1.6, y); ctx.moveTo(x, y - r * 1.6); ctx.lineTo(x, y + r * 1.6); ctx.stroke();
      ctx.setLineDash([4 * s, 4 * s]); ctx.lineWidth = 1.5 * s;
    }
    if (pr.water && !pr.diverge && f.t >= pr.end - 1) {
      const [x, y] = pr.pts[pr.pts.length - 1];
      ctx.setLineDash([]); ctx.strokeStyle = '#7fc8ff'; ctx.lineWidth = 2 * s;
      for (const rr of [5, 10]) { ctx.beginPath(); ctx.ellipse(x, y, rr * s, rr * s / 3, 0, 0, 7); ctx.stroke(); }
      ctx.setLineDash([4 * s, 4 * s]); ctx.lineWidth = 1.5 * s;
    }
    if (pr.diverge && f.t >= pr.t + pr.diverge.k) {
      const [x, y] = pr.diverge.wa, r = 6 * s;
      ctx.setLineDash([]); ctx.strokeStyle = '#ff4d4d'; ctx.lineWidth = 2.5 * s;
      ctx.beginPath(); ctx.moveTo(x - r, y - r); ctx.lineTo(x + r, y + r); ctx.moveTo(x + r, y - r); ctx.lineTo(x - r, y + r); ctx.stroke();
      ctx.setLineDash([4 * s, 4 * s]); ctx.lineWidth = 1.5 * s;
    }
  }
  ctx.setLineDash([]);
  // fire checks: this frame or the previous one (the trace keeps every 2nd frame)
  const fc = R.fchecks.get(f.t) || R.fchecks.get(f.t - 1);
  if (fc) {
    for (const b of fc.bad) {
      ctx.strokeStyle = '#ff4d4d'; ctx.lineWidth = 2.5 * s;
      ctx.beginPath(); ctx.arc(b[1], b[2], 9 * s, 0, 7); ctx.stroke();
    }
  }
  // animal physics / update / dig misses (px position)
  for (const t of [f.t, f.t - 1]) for (const m of (R.xbad.get(t) || [])) {
    const x = m.x != null ? m.x : m.wa[0] / 65536, y = m.y != null ? m.y : m.wa[1] / 65536;
    ctx.strokeStyle = '#ff4d4d'; ctx.lineWidth = 2.5 * s;
    ctx.beginPath(); ctx.arc(x, y, 12 * s, 0, 7); ctx.stroke();
  }
  // walking animals the model got wrong (WA's position)
  for (const t of [f.t, f.t - 1]) for (const m of (R.abad.get(t) || [])) {
    ctx.strokeStyle = '#ff4d4d'; ctx.lineWidth = 2.5 * s;
    ctx.beginPath(); ctx.arc(m.wa[0] / 65536, m.wa[1] / 65536, 10 * s, 0, 7); ctx.stroke();
  }
  modelHud(f, fc);
}
function modelHud(f, fc) {
  const live = R.preds.filter(pr => pr.t <= f.t && f.t <= pr.end + 100);
  const lines = [];
  if (fc) lines.push({ text: `fire model: ${fc.n - fc.bad.length}/${fc.n} exact`, bad: fc.bad.length > 0 });
  const ac = R.acount.get(f.t) || R.acount.get(f.t - 1);
  if (ac) lines.push({ text: `walking animals: ${ac.n - ac.bad}/${ac.n} exact`, bad: ac.bad > 0 });
  // gun / melee checks of the last 30 frames
  const wc = R.wchecks.filter(m => m.t <= f.t && f.t - m.t <= 30);
  if (wc.length) {
    const nm = { 11: 'shotgun', 12: 'handgun', 13: 'uzi', 14: 'minigun', 16: 'fire punch', 35: 'baseball bat' };
    const by = new Map();
    for (const m of wc) { const k = nm[m.weapon] || 'weapon ' + m.weapon; const v = by.get(k) || [0, 0]; v[0] += m.ok ? 1 : 0; v[1]++; by.set(k, v); }
    for (const [k, [ok, n]] of by) lines.push({ text: `${k} model: ${ok}/${n} exact`, bad: ok < n });
  }
  const pc = R.pcount.get(f.t) || R.pcount.get(f.t - 1);
  if (pc) lines.push({ text: `physics (animals, arrows): ${pc.n - pc.bad}/${pc.n} exact`, bad: pc.bad > 0 });
  const mc = R.mcount.get(f.t) || R.mcount.get(f.t - 1);
  if (mc) lines.push({ text: `animal fuse / detonation: ${mc.n - mc.bad}/${mc.n} exact`, bad: mc.bad > 0 });
  const gc = R.gas.get(f.t) || R.gas.get(f.t - 1);
  if (gc) lines.push({ text: `skunk gas: ${gc.n - gc.bad}/${gc.n} exact`, bad: gc.bad > 0 });
  for (const pr of live) {
    const k = pr.ball ? ['dragon ball'] : KINDS[(R.frames.find(fr => fr.t >= pr.t)?.proj.find(q => q[0] === pr.id) || [])[4]];
    lines.push({ text: `${k ? k[0] : 'projectile'}: ${pr.diverge ? 'model off after ' + pr.diverge.k + ' frames' : pr.water ? 'model exact to the water' : 'model exact'}`, bad: !!pr.diverge });
  }
  if (!lines.length) return;
  ctx.save(); ctx.scale(U * 0.9, U * 0.9);
  ctx.font = `13px ${FONT}`;
  const w = Math.max(...lines.map(l => ctx.measureText(l.text).width)) + 20, h = lines.length * 18 + 10, y0 = cv.height / (U * 0.9) - h - 8;
  ctx.fillStyle = 'rgba(14,16,19,0.72)'; ctx.beginPath(); ctx.roundRect(8, y0, w, h, 8); ctx.fill();
  ctx.textAlign = 'left';
  lines.forEach((l, k) => { ctx.fillStyle = l.bad ? '#ff8a80' : '#9fe0a8'; ctx.fillText(l.text, 18, y0 + 22 + k * 18); });
  ctx.restore();
}

// rendered sprite id -> [name, colour, shape, size]
const KINDS = {
  48: ['bazooka', '#ffb347', 'rocket', 7], 59: ['homing missile', '#ff6b6b', 'rocket', 7], 49: ['magic bullet', '#c78bff', 'rocket', 6],
  175: ['homing pigeon', '#e0e0e0', 'bird', 7], 52: ['mortar', '#d9a066', 'dot', 6], 53: ['cluster bomb', '#9ad06b', 'dot', 6],
  54: ['cluster piece', '#c8f08f', 'dot', 3.5], 51: ['banana', '#ffe14d', 'banana', 6], 50: ['grenade', '#5ecf5e', 'dot', 5.5],
  56: ['holy grenade', '#ffd700', 'cross', 7], 55: ['petrol bomb', '#ff7a45', 'bottle', 6], 78: ['dynamite', '#ff4040', 'stick', 6],
  65: ['sheep launcher', '#f0f0f0', 'dot', 6], 152: ['sheep (launched)', '#ffffff', 'sheep', 7], 153: ['sheep / super sheep', '#ffffff', 'sheep', 7],
  166: ['mole bomb', '#a0785a', 'dot', 6], 163: ['salvation army', '#ff8080', 'dot', 6], 57: ['salvation piece', '#ffb0b0', 'dot', 3.5],
  173: ['skunk', '#8fd18f', 'sheep', 6], 74: ['ming vase', '#7fb3ff', 'dot', 7], 75: ['vase shard', '#b3d1ff', 'dot', 3.5],
  164: ['mad cow', '#d8c8b0', 'sheep', 8], 162: ['old woman', '#d0a0ff', 'sheep', 7],
};
const hx = v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0');
function shape(x, y, [name, col, form, size], q, i) {
  const s = S(), r = size * s;
  // heading from the previous frame (rockets / bottles point where they fly)
  let a = 0;
  const p = i > 0 && R.frames[i - 1].proj.find(o => o[0] === q[0]);
  if (p && (p[1] !== x || p[2] !== y)) a = Math.atan2(y - p[2], x - p[1]);
  ctx.save(); ctx.translate(x, y); ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = 2 * s;
  if (form === 'rocket' || form === 'bottle' || form === 'stick') {
    ctx.rotate(a); ctx.fillRect(-r, -r * 0.4, r * 2, r * 0.8);
    if (form === 'rocket') { ctx.beginPath(); ctx.moveTo(r, -r * 0.4); ctx.lineTo(r * 1.6, 0); ctx.lineTo(r, r * 0.4); ctx.fill(); }
  } else if (form === 'banana') {
    ctx.beginPath(); ctx.arc(0, 0, r, 0.3, Math.PI - 0.3); ctx.stroke();
  } else if (form === 'cross') {
    ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill(); ctx.strokeStyle = '#7a5a00';
    ctx.beginPath(); ctx.moveTo(0, -r * 0.7); ctx.lineTo(0, r * 0.7); ctx.moveTo(-r * 0.5, -r * 0.2); ctx.lineTo(r * 0.5, -r * 0.2); ctx.stroke();
  } else if (form === 'sheep' || form === 'bird') {
    ctx.beginPath(); ctx.ellipse(0, 0, r, r * 0.7, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#333'; ctx.beginPath(); ctx.arc(r * 0.7 * (Math.cos(a) >= 0 ? 1 : -1), -r * 0.3, r * 0.35, 0, 7); ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
  }
  ctx.restore();
}
// top-right: what is on screen this frame
function legend(names) {
  if (!names.length) return;
  ctx.save(); ctx.scale(U * 0.9, U * 0.9);
  const W = cv.width / (U * 0.9);
  ctx.font = `13px ${FONT}`;
  const w = Math.max(...names.map(n => ctx.measureText(n).width)) + 20, h = names.length * 18 + 10;
  ctx.fillStyle = 'rgba(14,16,19,0.72)'; ctx.beginPath(); ctx.roundRect(W - w - 8, 8, w, h, 8); ctx.fill();
  ctx.fillStyle = '#c9ced6'; ctx.textAlign = 'left';
  names.forEach((n, k) => ctx.fillText(n, W - w + 2, 26 + k * 18));
  ctx.restore();
}

function canopy(x, y) {
  const s = S();
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.strokeStyle = C.chute; ctx.fillStyle = C.chute + '55'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, -26, 18, Math.PI, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-18, -26); ctx.lineTo(0, -6); ctx.lineTo(18, -26); ctx.stroke();
  ctx.restore();
}
const clock = t => { const s = Math.floor(t / 50); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };

// top-left: the replay's name, the turn, the wind
function hud(f, i) {
  ctx.save(); ctx.scale(U * 0.9, U * 0.9);
  const name = R.meta.name || '';
  ctx.font = `bold 15px ${FONT}`;
  const w = Math.max(240, ctx.measureText(name).width + 24);
  ctx.fillStyle = 'rgba(14,16,19,0.72)'; ctx.beginPath(); ctx.roundRect(8, 8, w, 52, 8); ctx.fill();
  ctx.fillStyle = '#e6e9ee'; ctx.textAlign = 'left'; ctx.fillText(name, 18, 29);
  ctx.font = `14px ${FONT}`; ctx.fillStyle = '#9aa3af';
  ctx.fillText(`turn ${turnOf(i) + 1} / ${R.turns.length}`, 18, 50);
  const wx = 190, wy = 45, L = Math.abs(f.wind) * 70, d = Math.sign(f.wind);
  ctx.strokeStyle = C.chute; ctx.fillStyle = C.chute; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(wx - L / 2 * d, wy); ctx.lineTo(wx + L / 2 * d, wy); ctx.stroke();
  if (d) { ctx.beginPath(); ctx.moveTo(wx + L / 2 * d + 8 * d, wy); ctx.lineTo(wx + L / 2 * d, wy - 6); ctx.lineTo(wx + L / 2 * d, wy + 6); ctx.fill(); }
  ctx.restore();
}

// ---------------------------------------------------------------- playback
function loop(now) {
  if (R) {
    if (playing) {
      pos += (now - last) / (FRAME_MS * 2) * +$('speed').value;   // a trace frame = 2 game frames
      if (pos >= R.frames.length - 1) { pos = R.frames.length - 1; playing = false; }
    }
    draw();
  }
  last = now;
  requestAnimationFrame(loop);
}
function jumpTurn(d) {
  const k = Math.max(0, Math.min(R.turns.length - 1, turnOf(Math.floor(pos)) + d));
  pos = R.turns[k];
}
function step(frames) { pos = Math.max(0, Math.min(R.frames.length - 1, Math.floor(pos) + frames)); }

$('play').onclick = () => { if (pos >= R.frames.length - 1) pos = 0; playing = !playing; };
$('prev').onclick = () => jumpTurn(-1);
$('next').onclick = () => jumpTurn(1);
$('seek').oninput = e => { pos = +e.target.value; };
$('open').onclick = $('openBig').onclick = () => $('file').click();
$('file').onchange = e => { if (e.target.files[0]) load(e.target.files[0]); e.target.value = ''; };
addEventListener('keydown', e => {
  if (!R || e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); $('play').click(); }
  else if (e.code === 'ArrowLeft') e.shiftKey ? jumpTurn(-1) : step(-25);
  else if (e.code === 'ArrowRight') e.shiftKey ? jumpTurn(1) : step(25);
  else if (e.code === 'Home') pos = 0;
  else if (e.code === 'End') pos = R.frames.length - 1;
  else if (e.code === 'KeyM') showModel = !showModel;
});
// drag and drop anywhere
addEventListener('dragover', e => { e.preventDefault(); $('drop').classList.add('over'); $('drop').style.display = 'flex'; });
addEventListener('dragleave', e => { if (e.target === $('drop')) { $('drop').classList.remove('over'); if (R) $('drop').style.display = 'none'; } });
addEventListener('drop', e => {
  e.preventDefault(); $('drop').classList.remove('over');
  const f = e.dataTransfer.files[0]; if (f) load(f); else if (R) $('drop').style.display = 'none';
});
requestAnimationFrame(loop);
</script>
</body>
